name: Repository Preflight

on:
  push:
    branches:
      - main
      - hardening-v4
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sanitized booking example
        run: npm run preflight

      - name: Verify secrets are not committed
        shell: bash
        run: |
          test ! -f cypress.env.json
          test ! -f cypress/fixtures/passenger_data.json
